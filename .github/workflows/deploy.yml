name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: 116.203.89.77
      PROJECT_PATH: /root/hetzner-hosting/projects/jobmosaic
      DOCKER_PATH: /root/hetzner-hosting
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache npm Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Deploy to Hetzner
        run: |
          # Debug info
          echo "Debug: Setting up deployment variables"
          echo "PROJECT_PATH: ${{ env.PROJECT_PATH }}"
          echo "DOCKER_PATH: ${{ env.DOCKER_PATH }}"
          echo "REPO_URL: ${{ env.REPO_URL }}"

          # Export variables for use in heredoc
          export PROJECT_PATH="${{ env.PROJECT_PATH }}"
          export DOCKER_PATH="${{ env.DOCKER_PATH }}"
          export REPO_URL="${{ env.REPO_URL }}"

          ssh -tt root@${{ env.SSH_HOST }} bash -s <<'EOT'
          set -e
          echo "Starting deployment..."

          # Debug: Print working directory and variables
          pwd
          echo "PROJECT_PATH: $PROJECT_PATH"
          echo "DOCKER_PATH: $DOCKER_PATH"

          # Create project directory if it doesn't exist
          mkdir -p "$PROJECT_PATH"

          # Check if git repository exists
          if [ ! -d "$PROJECT_PATH/.git" ]; then
              echo "Initializing new repository..."
              rm -rf "$PROJECT_PATH"/*
              git clone "$REPO_URL" "$PROJECT_PATH"
              cd "$PROJECT_PATH"
          else
              echo "Repository exists, pulling latest changes..."
              cd "$PROJECT_PATH"
              git fetch --all
              git reset --hard origin/main
          fi

          # Navigate to docker directory
          cd "$DOCKER_PATH"

          # Rebuild and restart containers
          docker compose down
          docker compose build
          docker compose up -d

          # Wait for containers to be ready
          sleep 10

          # Run Laravel commands
          docker compose exec -T jobmosaic_app php artisan migrate --force
          docker compose exec -T jobmosaic_app php artisan config:cache

          # Install and build frontend
          docker compose exec -T jobmosaic_app npm ci
          docker compose exec -T jobmosaic_app npm run build

          echo "Deployment completed successfully!"
          EOT

      - name: Verify Deployment
        run: |
          ssh root@${{ env.SSH_HOST }} "docker compose ps"
