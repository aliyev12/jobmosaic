name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: 116.203.89.77
      PROJECT_PATH: /root/hetzner-hosting/projects/jobmosaic
      DOCKER_PATH: /root/hetzner-hosting
      REPO_URL: git@github.com:${{ github.repository }}.git

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache npm Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Deploy to Hetzner
        run: |
          ssh root@${{ env.SSH_HOST }} \
          PROJECT_PATH='${{ env.PROJECT_PATH }}' \
          DOCKER_PATH='${{ env.DOCKER_PATH }}' \
          REPO_URL='${{ env.REPO_URL }}' \
          'bash -s' << 'EOT'
          set -e
          echo "Starting deployment..."

          echo "Debug: Current environment"
          echo "PROJECT_PATH: $PROJECT_PATH"
          echo "DOCKER_PATH: $DOCKER_PATH"
          echo "REPO_URL: $REPO_URL"

          # Create project directory if it doesn't exist
          mkdir -p "$PROJECT_PATH"

          # Check if git repository exists
          if [ ! -d "$PROJECT_PATH/.git" ]; then
              echo "Initializing new repository..."
              rm -rf "$PROJECT_PATH"/*
              git clone "$REPO_URL" "$PROJECT_PATH"
              cd "$PROJECT_PATH"
          else
              echo "Repository exists, pulling latest changes..."
              cd "$PROJECT_PATH"
              git fetch --all
              git reset --hard origin/main
          fi

          echo "Navigate to docker directory"
          cd "$DOCKER_PATH"

          echo "Rebuild and restart containers"
          docker compose down
          docker compose build
          docker compose up -d

          echo docker container ls
          echo "Run Laravel commands"
          docker compose exec -T jobmosaic_app php artisan migrate --force
          docker compose exec -T jobmosaic_app php artisan config:cache

          echo "Install and build frontend"
          docker compose exec -T jobmosaic_app npm ci
          docker compose exec -T jobmosaic_app npm run build

          echo "Deployment completed successfully!"
          EOT

      - name: Wait for jobmosaic_app to be ready
        run: |
          for i in {1..10}; do
            if ssh root@${{ env.SSH_HOST }} "docker compose ps | grep jobmosaic_app | grep 'Up'"; then
              echo "jobmosaic_app is running."
              break
            else
              echo "Waiting for jobmosaic_app to start..."
              sleep 10  # Wait for 10 seconds before checking again
            fi
          done

      - name: Run Laravel commands
        run: |
          ssh root@${{ env.SSH_HOST }} "docker compose exec -T jobmosaic_app php artisan migrate --force"

      - name: Verify Deployment
        run: |
          ssh root@${{ env.SSH_HOST }} "docker compose ps"

      - name: List running Docker containers
        run: |
          ssh root@${{ env.SSH_HOST }} "docker container ls"
